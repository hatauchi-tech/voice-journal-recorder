<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音声ジャーナル 録音</title>
<style>
  :root {color-scheme:light; --ink:#213b34; --muted:#63766d; --paper:#faf8f2; --line:#dce2d9; --red:#b44534}
  * {box-sizing:border-box}
  body {margin:0; background:var(--paper); color:var(--ink); font:16px/1.75 system-ui,-apple-system,"Yu Gothic",sans-serif}
  main {max-width:420px; margin:0 auto; padding:40px 24px; text-align:center}
  #recordBtn {display:grid; place-items:center; margin:20px auto; width:104px; height:104px; border:0; border-radius:50%; background:var(--ink); color:white; font-size:14px; box-shadow:0 6px 20px #203d3620; cursor:pointer}
  #recordBtn:disabled {opacity:.45; cursor:default}
  #recordBtn.recording {background:var(--red)}
  #timer {font-size:32px; font-weight:300; font-variant-numeric:tabular-nums; margin:10px 0}
  #status {margin:16px 0; font-size:14px; color:var(--muted); white-space:pre-line; overflow-wrap:anywhere}
  #status.error {color:var(--red)}
  #downloadLink {display:inline-block; margin-top:8px; font-size:14px; color:var(--ink)}
</style>
</head>
<body>
<main>
  <h1>録音</h1>
  <button id="recordBtn" type="button" disabled>録音開始</button>
  <p id="timer">00:00</p>
  <p id="status">確認しています…</p>
  <a id="downloadLink" hidden>音声を端末に保存</a>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const targetOrigin = params.get('origin') || '';
  const maxAudioBytes = Number(params.get('maxAudioBytes')) || 14 * 1024 * 1024;
  const maxDurationSec = Number(params.get('maxDurationSec')) || 3600;
  const chunkSize = Number(params.get('chunkSize')) || 2 * 1024 * 1024;
  const ACK_TIMEOUT_MS = 8000;
  // GAS WebアプリのHtmlServiceコンテンツはApps Scriptがスクリプトごとに割り当てるサンドボックス
  // ドメイン(n-<hash>-script.googleusercontent.com)のiframe内で動く。ここを正規表現で広く許可すると
  // 「畑内さんのアプリ」ではなく「任意のGAS Webアプリ」を送信先として許可してしまい、攻撃者が自分の
  // GASアプリのoriginを渡してこのページを開けば録音を横取りできる(2026-09-23 セキュリティレビュー指摘)。
  // そのため実測済みのオリジンだけを列挙する完全一致リストにしている。
  const ALLOWED_ORIGINS = [
    'https://n-wqe27nxp7okg5q2gwad4purjpsgiuqqv5xu4xtq-0lu-script.googleusercontent.com' // 検証用GAS(15bMtbix…)で実測(2026-09-18)
  ];

  const ui = {recordBtn: document.getElementById('recordBtn'), timer: document.getElementById('timer'), status: document.getElementById('status'), downloadLink: document.getElementById('downloadLink')};
  let mediaRecorder, audioChunks = [], stream, startTime, startTick, stoppedTick, timerInterval, receivedBytes = 0;
  let hasUnsentAudio = false;

  function showStatus(text, error) {
    ui.status.textContent = text;
    ui.status.classList.toggle('error', !!error);
  }

  function stopTracks() { if (stream) stream.getTracks().forEach(track => track.stop()); stream = null; }

  async function startRecording() {
    ui.recordBtn.disabled = true;
    try {
      if (!navigator.mediaDevices || !window.MediaRecorder) throw new Error('このブラウザは録音に対応していません。SafariまたはChromeで開いてください。');
      stream = await navigator.mediaDevices.getUserMedia({audio: true});
      const mimeType = ['audio/webm;codecs=opus','audio/mp4','audio/ogg;codecs=opus'].find(type => MediaRecorder.isTypeSupported(type));
      if (!mimeType) throw new Error('対応する録音形式が見つかりません。');
      mediaRecorder = new MediaRecorder(stream, {mimeType: mimeType, audioBitsPerSecond: 64000});
      audioChunks = []; receivedBytes = 0;
      mediaRecorder.ondataavailable = event => {
        if (event.data.size > 0) {audioChunks.push(event.data); receivedBytes += event.data.size;}
        if (receivedBytes >= maxAudioBytes - chunkSize && mediaRecorder.state === 'recording') stopRecording();
      };
      mediaRecorder.onerror = () => {showStatus('録音が中断しました。',true); if (mediaRecorder.state === 'recording') stopRecording();};
      mediaRecorder.onstop = processRecording;
      startTime = Date.now(); startTick = performance.now(); stoppedTick = null;
      mediaRecorder.start(1000);
      ui.recordBtn.textContent = '停止'; ui.recordBtn.classList.add('recording'); ui.recordBtn.disabled = false;
      showStatus('録音中。タップして停止');
      ui.timer.textContent = '00:00'; timerInterval = setInterval(updateTimer, 500);
    } catch (error) {
      stopTracks(); ui.recordBtn.disabled = false;
      showStatus(error.name === 'NotAllowedError' ? 'マイクを使えません。ブラウザのマイク許可を確認してください。' : error.message, true);
    }
  }

  function updateTimer() {
    const elapsed = Math.floor((performance.now() - startTick) / 1000);
    ui.timer.textContent = String(Math.floor(elapsed / 60)).padStart(2,'0') + ':' + String(elapsed % 60).padStart(2,'0');
    if (elapsed >= maxDurationSec && mediaRecorder.state === 'recording') stopRecording();
  }

  function stopRecording() {
    if (!mediaRecorder || mediaRecorder.state !== 'recording') return;
    stoppedTick = performance.now(); clearInterval(timerInterval);
    ui.recordBtn.disabled = true; ui.recordBtn.classList.remove('recording');
    showStatus('録音を送信しています…');
    mediaRecorder.stop();
  }

  function offerDownload(blob, mimeType, recordedAt, message) {
    const extension = {'audio/webm':'webm','audio/mp4':'m4a','audio/ogg':'ogg'}[mimeType] || 'audio';
    const url = URL.createObjectURL(blob);
    ui.downloadLink.href = url;
    ui.downloadLink.download = '日記_' + recordedAt.replace(/[:.]/g,'-') + '.' + extension;
    ui.downloadLink.hidden = false;
    ui.downloadLink.addEventListener('click', () => {hasUnsentAudio = false;}, {once: true});
    showStatus(message, true);
  }

  function waitForAck() {
    return new Promise(resolve => {
      function onAck(event) {
        if (event.origin !== targetOrigin || event.source !== window.opener) return;
        if (!event.data || event.data.type !== 'voiceJournalRecordingAck' || event.data.version !== 1) return;
        window.removeEventListener('message', onAck);
        clearTimeout(timer);
        resolve(true);
      }
      window.addEventListener('message', onAck);
      const timer = setTimeout(() => {
        window.removeEventListener('message', onAck);
        resolve(false);
      }, ACK_TIMEOUT_MS);
    });
  }

  async function processRecording() {
    clearInterval(timerInterval); stopTracks();
    const mimeType = mediaRecorder.mimeType.split(';')[0];
    const blob = new Blob(audioChunks, {type: mimeType}); audioChunks = [];
    if (!blob.size) {
      showStatus('音声を取得できませんでした。もう一度録音してください。', true);
      ui.recordBtn.disabled = false; ui.recordBtn.textContent = '録音開始';
      return;
    }
    const durationSec = Math.max(.001, ((stoppedTick || performance.now()) - startTick) / 1000);
    const recordedAt = new Date(startTime).toISOString();
    hasUnsentAudio = true;
    if (!window.opener || window.opener.closed) {
      offerDownload(blob, mimeType, recordedAt, '元の画面と接続できません。下のリンクから音声を端末に保存してください。');
      return;
    }
    window.opener.postMessage({
      type: 'voiceJournalRecording', version: 1,
      blob: blob, mimeType: mimeType,
      recordedAt: recordedAt,
      durationSec: durationSec
    }, targetOrigin);
    showStatus('送信しています…');
    const acknowledged = await waitForAck();
    if (acknowledged) {
      hasUnsentAudio = false;
      showStatus('送信しました。このウィンドウを閉じます…');
      ui.recordBtn.hidden = true;
      setTimeout(() => window.close(), 800);
    } else {
      offerDownload(blob, mimeType, recordedAt, '元の画面に届いたか確認できませんでした。念のため下のリンクから音声を端末に保存してください。');
    }
  }

  if (!window.opener) {
    showStatus('録音元の画面と接続できません。音声ジャーナルの画面から開き直してください。', true);
  } else if (!ALLOWED_ORIGINS.includes(targetOrigin)) {
    console.warn('許可されていないorigin: ' + targetOrigin);
    showStatus('このページは音声ジャーナルの画面からのみ利用できます。音声ジャーナルの画面から開き直してください。', true);
  } else {
    ui.recordBtn.disabled = false;
    showStatus('タップして録音開始');
    ui.recordBtn.addEventListener('click', () => mediaRecorder && mediaRecorder.state === 'recording' ? stopRecording() : startRecording());
  }
  window.addEventListener('beforeunload', event => {if ((mediaRecorder && mediaRecorder.state === 'recording') || hasUnsentAudio) {event.preventDefault(); event.returnValue = '';}});
</script>
</body>
</html>
